<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#141619"/>
  <grid width="800" height="500">
    <line x1="0" y1="400" x2="800" y2="400" stroke="#2D323A" stroke-width="2"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#2D323A" stroke-width="1" stroke-dasharray="4 4"/>
  </grid>
  <!-- Table -->
  <rect x="250" y="380" width="300" height="20" rx="3" fill="#252A30" stroke="#3E444E" stroke-width="2"/>
  <line x1="280" y1="400" x2="280" y2="480" stroke="#252A30" stroke-width="8"/>
  <line x1="520" y1="400" x2="520" y2="480" stroke="#252A30" stroke-width="8"/>
  <!-- Arm -->
  <circle cx="400" cy="380" r="30" fill="#1D2024" stroke="#FF5000" stroke-width="2"/>
  <line x1="400" y1="380" x2="430" y2="260" stroke="#FF5000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="430" cy="260" r="18" fill="#141619" stroke="#FF5000" stroke-width="2"/>
  <line x1="430" y1="260" x2="350" y2="180" stroke="#FF5000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="350" cy="180" r="14" fill="#FF5000"/>
  <!-- Gripper & Workpiece -->
  <rect x="335" y="180" width="30" height="25" fill="#2D323A" stroke="#7D8590"/>
  <rect x="340" y="210" width="20" height="25" rx="2" fill="#00E5FF"/>
  <text x="400" y="460" text-anchor="middle" fill="#7D8590" font-family="monospace" font-size="12">I2RT YAM-06 TELEOPERATION WORKCELL // STEP-THROUGH SIMULATION</text>
</svg>

